<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>截留视觉提案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
:root{
  /* Layout: workbench — header strip, a scaled 1440×900 simulated Mac desktop, spec sheet in three columns beneath */
  color-scheme:dark;
  --bg:#0b0c0f; --panel:#121419; --raise:#1a1d23; --line:#252932; --fg:#e8eaee; --muted:#8b919c; --dim:#5b616c; --body:#c2c6cd;
  --guide:#30d5f7; --sel:#4b8dff; --copy:#34c76f; --badge:#ff453a;
  --rgb-r:#ff3b5c; --rgb-g:#2be38c; --rgb-b:#3d7bff;
  --sans:"Geist",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --checker:repeating-conic-gradient(#d6d6d6 0 25%,#fff 0 50%);
  --ants:linear-gradient(90deg,#fff 50%,#111 50%),linear-gradient(90deg,#fff 50%,#111 50%),linear-gradient(0deg,#fff 50%,#111 50%),linear-gradient(0deg,#fff 50%,#111 50%);
}
html,body{min-height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.app{padding-inline:16px;padding-block:0 48px;max-width:1680px;margin:0 auto}

/* header */
.bar{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;color:var(--fg)}
.brand b{font-size:17px;font-weight:600;letter-spacing:.04em}
.brand small{font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{font:500 13px var(--sans);color:var(--muted);background:none;border:0;border-radius:7px;padding:6px 12px;display:flex;align-items:center;gap:8px;cursor:pointer}
.seg button em{font:500 10.5px var(--mono);font-style:normal;color:var(--dim)}
.seg button[aria-selected=true]{background:var(--raise);color:var(--fg);box-shadow:0 0 0 1px #2f343e}
.seg button[aria-selected=true] em{color:var(--muted)}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.sw-A{background:var(--guide)}
.sw-B{background:linear-gradient(90deg,var(--rgb-r) 0 33%,var(--rgb-g) 0 66%,var(--rgb-b) 0)}
.sw-C{background:var(--checker) 0 0/5px 5px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font:500 12.5px var(--sans);color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.btn:hover{border-color:#3a3f49}
.btn[aria-pressed=false]{color:var(--dim)}
.btn[aria-pressed=false] .dot{background:var(--dim)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--copy)}
.sep{width:1px;height:20px;background:var(--line);margin-inline:4px}
kbd{font:500 10.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--bg)}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

/* stage */
.stage-box{position:relative;width:min(100%,calc((100vh - 96px) * 1.6));min-width:min(100%,560px);aspect-ratio:1440/900;max-width:100%;margin-inline:auto;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line),0 30px 80px -20px rgba(0,0,0,.7)}
.cap-row{display:flex;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;width:min(100%,calc((100vh - 96px) * 1.6));min-width:min(100%,560px);margin:10px auto 0;font:500 11.5px var(--mono);color:var(--muted)}
#stage{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0;overflow:hidden;user-select:none;-webkit-user-select:none;font-family:var(--sans);touch-action:none;background:#0e1b24}
#desk{position:absolute;left:0;top:0;width:1440px;height:900px}
#fx{position:absolute;left:0;top:0;width:1440px;height:900px;pointer-events:none;z-index:40}
#tray{position:absolute;inset:0;pointer-events:none;z-index:20}
#tray .shot,#tray .pe{pointer-events:auto}

.shot{position:relative;cursor:grab;border-radius:3px}
.shot img{display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit;pointer-events:none;-webkit-user-drag:none}
.shot.is-sel::after{content:"";position:absolute;inset:-4px;pointer-events:none;background-image:var(--ants);background-repeat:repeat-x,repeat-x,repeat-y,repeat-y;background-size:8px 1px,8px 1px,1px 8px,1px 8px;background-position:0 0,0 100%,0 0,100% 0;animation:ants .6s linear infinite;z-index:3}
.shot.is-sel::before{content:"";position:absolute;inset:-7px;pointer-events:none;z-index:4;background:linear-gradient(#fff,#fff) left top/6px 6px no-repeat,linear-gradient(#fff,#fff) right top/6px 6px no-repeat,linear-gradient(#fff,#fff) left bottom/6px 6px no-repeat,linear-gradient(#fff,#fff) right bottom/6px 6px no-repeat;filter:drop-shadow(0 0 1px rgba(0,0,0,.9))}
.shot.dragging{opacity:.3}
@keyframes ants{to{background-position:8px 0,-8px 100%,0 -8px,100% 8px}}
.noanim,.noanim *{transition:none!important}

.folder-chip{font:500 11px var(--mono);color:#dfe2e7;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:2px 8px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
.folder-chip b{color:#fff;font-weight:600}
.folder-chip:hover{background:rgba(255,255,255,.14)}
.folder-chip.pulse{animation:pulse .5s}
@keyframes pulse{40%{background:rgba(255,255,255,.3);box-shadow:0 0 0 4px rgba(255,255,255,.12)}}

/* ── A · Ruler ── */
.A-ruler{position:absolute;left:0;top:32px;width:1440px;height:22px;background:rgba(14,16,20,.82);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);box-shadow:inset 0 -1px 0 rgba(255,255,255,.1);clip-path:inset(0 0 0 0);transition:clip-path .5s cubic-bezier(.65,0,.25,1)}
.A-ticks{position:absolute;left:0;top:0;width:1440px;height:22px}
.A-cur{position:absolute;top:0;left:0;width:1px;height:22px;background:rgba(255,255,255,.7);opacity:0}
.A-band{position:absolute;top:0;left:0;height:22px;background:rgba(48,213,247,.16);box-shadow:inset 1px 0 var(--guide),inset -1px 0 var(--guide);opacity:0;transition:opacity .2s}
.A-band.on{opacity:1}
.A-band span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:600 10.5px var(--mono);color:var(--guide);background:#0e1014;padding:1px 6px;border-radius:3px;white-space:nowrap}
.A-folder{position:absolute;right:8px;top:2px;height:18px;padding:0 8px}
.A-items{position:absolute;inset:0;transition:transform .45s cubic-bezier(.65,0,.25,1) .12s,opacity .3s .12s}
.A-root.hid .A-items{transform:translateY(-170px);opacity:0;transition-delay:0s}
.A-root.hid .A-ruler{clip-path:inset(0 50% 0 50%);transition-delay:.2s}
.A-root.hid *{pointer-events:none!important}
.A-hang{position:absolute;left:0;top:54px;transform:translateX(var(--x));transform-origin:0 0;transition:transform .6s cubic-bezier(.3,1.3,.45,1)}
.A-guide{position:absolute;left:50%;top:0;width:1px;height:14px;margin-left:-.5px;background:var(--guide);box-shadow:0 0 6px rgba(48,213,247,.8)}
.A-guide::before{content:"";position:absolute;left:-3px;top:-3.5px;width:7px;height:7px;background:var(--guide);transform:rotate(45deg)}
.A-hang .shot{position:absolute;left:0;top:14px;transform-origin:0 0;box-shadow:0 0 0 1px rgba(255,255,255,.2),0 10px 24px rgba(0,0,0,.45);transition:box-shadow .2s}
.A-hang .shot:hover{box-shadow:0 0 0 1px var(--guide),0 14px 30px rgba(0,0,0,.55)}
.A-cap{position:absolute;left:0;font:500 11px var(--mono);color:#f1f3f6;display:flex;gap:6px;white-space:nowrap;background:rgba(10,12,16,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:2px 6px;border-radius:4px;transition:opacity .25s}
.A-cap span{color:rgba(255,255,255,.5)}

/* ── B · Ring buffer (lives in the notch) ── */
#notch{position:absolute;left:720px;top:0;width:196px;height:32px;transform:translateX(-50%);z-index:30;pointer-events:none;transition:width .6s cubic-bezier(.3,1.16,.4,1),height .6s cubic-bezier(.3,1.16,.4,1)}
#notch::before,#notch::after{content:"";position:absolute;top:0;width:10px;height:10px}
#notch::before{left:-10px;background:radial-gradient(circle at 0 100%,transparent 9.5px,#000 10px)}
#notch::after{right:-10px;background:radial-gradient(circle at 100% 100%,transparent 9.5px,#000 10px)}
.notch-body{position:absolute;inset:0;background:#000;border-radius:0 0 16px 16px;overflow:hidden;transition:border-radius .6s,box-shadow .6s}
.cam-dot{position:absolute;left:50%;top:11px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2a3a52,#0b1018 60%);box-shadow:0 0 0 1.5px #0d0d0f}
#notch.open{width:1000px;height:166px;pointer-events:auto}
#notch.open .notch-body{border-radius:0 0 30px 30px;box-shadow:0 26px 60px rgba(0,0,0,.5)}
#notch:not(.open) *{pointer-events:none!important}
.notch-in{position:absolute;top:0;left:50%;width:1000px;height:166px;margin-left:-500px;opacity:0;transition:opacity .15s}
#notch.open .notch-in{opacity:1;transition:opacity .3s .22s}
.B-top{position:absolute;left:0;right:0;top:0;height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font:500 11px var(--mono);letter-spacing:.08em;color:#7d838d}
.B-top em{font-style:normal;color:#fff}
.B-folder{letter-spacing:.04em}
.B-slots{position:absolute;left:26px;top:42px;display:flex;gap:12px}
.B-slot{width:108px}
.B-shot{width:108px;height:68px;border-radius:4px;background:#0a0a0b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.B-shot canvas{width:108px;height:68px;display:block;border-radius:4px}
.B-slot.empty .B-shot{box-shadow:none;outline:1px dashed rgba(255,255,255,.16);outline-offset:-1px;cursor:default}
.B-slot.wp .B-shot::before{content:"";position:absolute;left:0;right:0;bottom:-5px;height:2px;background:linear-gradient(90deg,var(--rgb-r) 0 33%,var(--rgb-g) 0 66%,var(--rgb-b) 0);animation:blink 1s steps(2,start) infinite}
.B-slot.io .B-shot{box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),0 0 18px rgba(61,123,255,.35)}
@keyframes blink{50%{opacity:0}}
.B-cap{margin-top:9px;font:500 10.5px/1.3 var(--mono);color:#6d727b;display:flex;justify-content:space-between}
.B-cap b{color:#cfd2d8;font-weight:500}
.B-cap .io{color:var(--rgb-g)}
.B-dim{font:500 10.5px/1.3 var(--mono);color:#555a63;margin-top:2px}

/* ── C · Layers ── */
.C-root{position:absolute;inset:0;transition:transform .5s cubic-bezier(.65,0,.25,1),opacity .35s}
.C-root.hid{transform:translateY(-200px);opacity:0}
.C-root.hid *{pointer-events:none!important}
.C-band{position:absolute;left:0;top:32px;width:1440px;height:200px;background:linear-gradient(rgba(6,7,10,.62),rgba(6,7,10,.3) 60%,rgba(6,7,10,0));pointer-events:none}
.C-stack,.C-tags{position:absolute;inset:0}
.C-layer{position:absolute;left:0;top:0;--rx:-16deg;--ry:-48deg;--s:1;transform:translate(var(--x,0px),var(--y,0px)) rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--s));transition:transform .55s cubic-bezier(.3,1.2,.4,1),opacity .3s,box-shadow .3s;background:var(--checker) 0 0/12px 12px;box-shadow:0 0 0 1px rgba(255,255,255,.45),0 18px 30px rgba(0,0,0,.45);border-radius:2px}
.C-layer img{object-fit:fill}
.C-root.spread .C-layer:hover,.C-layer.grab{--rx:0deg;--ry:0deg;--s:1.12;z-index:300!important;box-shadow:0 0 0 1px #fff,0 30px 60px rgba(0,0,0,.6)}
.C-layer.flying{z-index:400!important;transition:none}
.C-tag{position:absolute;left:0;top:0;font:500 11px var(--mono);color:#e9ebef;white-space:nowrap;display:flex;gap:6px;align-items:center;background:rgba(12,14,18,.8);padding:3px 7px;border-radius:5px;opacity:0;transition:opacity .25s,transform .55s cubic-bezier(.3,1.2,.4,1)}
.C-tag i{width:9px;height:9px;background:var(--checker) 0 0/4.5px 4.5px;box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.C-root.spread .C-tag{opacity:1}
.C-sum{position:absolute;left:720px;top:186px;transform:translateX(-50%);font:500 11px var(--mono);color:rgba(255,255,255,.78);white-space:nowrap;transition:opacity .2s;background:rgba(12,14,18,.6);padding:2px 8px;border-radius:5px}
.C-root.spread .C-sum{opacity:0}
.C-hole{position:absolute;background:var(--checker) 0 0/16px 16px}
.C-hole::after{content:"";position:absolute;inset:0;background-image:var(--ants);background-repeat:repeat-x,repeat-x,repeat-y,repeat-y;background-size:8px 1px,8px 1px,1px 8px,1px 8px;background-position:0 0,0 100%,0 0,100% 0;animation:ants .6s linear infinite}
.C-folder{position:absolute;right:24px;top:44px}

/* capture overlay */
.flash{position:absolute;background:#fff;z-index:60;pointer-events:none}
#cap{position:absolute;inset:0;z-index:80;display:none;cursor:none}
#cap.on{display:block}
#cap.demo{pointer-events:none}
#cross{position:absolute;left:0;top:0;pointer-events:none}
#cross svg{position:absolute;left:-15.5px;top:-15.5px}
#coord{position:absolute;left:12px;top:12px;font:500 11px var(--mono);color:#fff;text-shadow:0 0 2px #000,0 0 4px #000;white-space:nowrap}
#cap.window #cross{display:none}
#cam{position:absolute;left:0;top:0;display:none;pointer-events:none}
#cap.window #cam{display:block}
#marq{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.24);background:rgba(255,255,255,.05)}
#marq::after{content:"";position:absolute;inset:0;background-image:var(--ants);background-repeat:repeat-x,repeat-x,repeat-y,repeat-y;background-size:8px 1px,8px 1px,1px 8px,1px 8px;background-position:0 0,0 100%,0 0,100% 0;animation:ants .6s linear infinite}
#msize{position:absolute;right:0;top:calc(100% + 6px);font:600 11px var(--mono);color:#fff;background:rgba(0,0,0,.75);padding:2px 6px;border-radius:4px;white-space:nowrap}
#winhi{position:absolute;background:rgba(80,145,255,.3);border-radius:12px;transition:left .12s,top .12s,width .12s,height .12s}

/* drag, quick look, toast, hint */
#dropHint{position:absolute;z-index:6;border-radius:12px;box-shadow:inset 0 0 0 2px var(--sel);background:rgba(75,141,255,.1);opacity:0;transition:opacity .15s;pointer-events:none}
#dropHint.on{opacity:1}
#dropHint span{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font:600 12px var(--sans);color:#fff;background:var(--sel);padding:4px 10px;border-radius:999px;white-space:nowrap}
#ghost{position:absolute;left:0;top:0;z-index:70;pointer-events:none}
.g-card{position:absolute;left:0;top:0;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.45),0 20px 40px rgba(0,0,0,.5);opacity:.94}
.g-card img{width:100%;height:100%;display:block}
.g-plus{position:absolute;left:10px;top:12px;width:20px;height:20px;border-radius:50%;background:var(--copy);color:#fff;font:700 16px/20px var(--sans);text-align:center;box-shadow:0 0 0 1.5px #fff,0 2px 6px rgba(0,0,0,.4);opacity:0;transform:scale(.4);transition:.15s;z-index:20}
#ghost.copy .g-plus{opacity:1;transform:none}
.g-count{position:absolute;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--badge);color:#fff;font:600 12px/20px var(--sans);text-align:center;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.4)}
#ql{position:absolute;inset:0;z-index:90;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center}
#ql figure{margin:0;background:rgba(30,32,38,.94);border-radius:14px;padding:10px 10px 12px;box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.12)}
#ql img{border-radius:6px;display:block}
#ql figcaption{display:flex;justify-content:space-between;gap:16px;padding:10px 4px 0;font:500 12px var(--mono);color:#c9ccd2}
#ql figcaption span{color:#80868f}
#toast{position:absolute;left:720px;bottom:40px;transform:translate(-50%,16px);opacity:0;transition:.25s;z-index:85;background:rgba(20,22,27,.92);color:#fff;font:500 14px var(--sans);padding:10px 16px;border-radius:10px;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.4);pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#hint{position:absolute;left:720px;top:44px;transform:translate(-50%,-8px);opacity:0;transition:.35s;z-index:25;font:500 12px var(--sans);color:#fff;background:rgba(12,14,18,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:5px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
#hint.on{opacity:1;transform:translate(-50%,0)}

/* spec sheet */
.spec{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.1fr) minmax(0,1fr);gap:24px 44px;max-width:1240px;margin:36px auto 0}
.spec > div{min-width:0}
.eyebrow{font:500 11px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.spec h2{font-size:36px;font-weight:600;margin:8px 0 0;letter-spacing:.02em;text-wrap:balance;line-height:1.1}
.spec .en{font:500 13px var(--mono);color:var(--muted);margin-top:6px}
.spec .lede{font-size:15.5px;line-height:1.75;color:var(--fg);margin:16px 0 0;max-width:34em}
.spec h3{font:500 11px var(--mono);letter-spacing:.14em;color:var(--muted);margin:26px 0 10px;text-transform:uppercase}
.spec > div > h3:first-child{margin-top:4px}
.spec p{line-height:1.75;color:var(--body);margin:0;max-width:34em}
.spec ol{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:10px}
.spec ol li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;line-height:1.65;color:var(--body)}
.spec ol li::before{content:counter(s,decimal-leading-zero);font:500 11px var(--mono);color:var(--dim);padding-top:4px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:0}
.keys dt{font-weight:500;color:var(--fg);white-space:nowrap}
.keys dd{margin:0;color:var(--body);line-height:1.6}
.keys kbd{margin-right:3px}
code{font:500 .92em var(--mono);color:var(--fg)}
@media (max-width:960px){.spec{grid-template-columns:minmax(0,1fr);gap:8px}.spec h2{font-size:30px}.seg{order:3;width:100%}.seg button{flex:1;justify-content:center;padding-inline:6px}.seg button em{display:none}}
@media (prefers-reduced-motion:reduce){.shot.is-sel::after,#marq::after,.C-hole::after,.B-slot.wp .B-shot::before{animation:none}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 7V2h5M15 2h5v5M20 15v5h-5M7 20H2v-5"/><path d="M11 7.5v7M7.5 11h7" stroke-width="1.2"/></svg>
      <b>截留</b><small>视觉提案 · 三个方向</small>
    </div>
    <nav class="seg" role="tablist" aria-label="设计方向">
      <button role="tab" id="tab-A" data-k="A" aria-selected="true"><span class="sw sw-A"></span>A 标尺<em>Ruler</em></button>
      <button role="tab" id="tab-B" data-k="B" aria-selected="false"><span class="sw sw-B"></span>B 帧缓冲<em>Buffer</em></button>
      <button role="tab" id="tab-C" data-k="C" aria-selected="false"><span class="sw sw-C"></span>C 图层<em>Layers</em></button>
    </nav>
    <div class="tools">
      <button class="btn" id="b-region" type="button">框选 <kbd>4</kbd></button>
      <button class="btn" id="b-window" type="button">窗口 <kbd>W</kbd></button>
      <button class="btn" id="b-full" type="button">全屏 <kbd>3</kbd></button>
      <span class="sep" aria-hidden="true"></span>
      <button class="btn" id="b-hide" type="button" aria-pressed="true"><span class="dot"></span>自动收起</button>
      <button class="btn" id="b-sound" type="button" aria-pressed="true"><span class="dot"></span>声音</button>
    </div>
  </header>

  <div class="stage-box" id="stageBox">
    <div id="stage">

    c.textAlign='center';c.fillStyle='#4b8dff';c.font='600 11px '+MONO;c.fillText('19',x0+13*bw+bw/2,y1-(y1-y0)*19/20-10);
    c.fillStyle='#9aa0a8';c.font='500 10px '+MONO;[0,7,13].forEach(i=>{const d=new Date(Date.now()-(13-i)*864e5);c.fillText(`${d.getMonth()+1}/${d.getDate()}`,x0+i*bw+bw/2,y1+14);});

      for(const m of ln.matchAll(TOK)){const s=m[0];let col='#e3e6ea';if(m[1])col='#7f8b97';else if(m[2])col='#ff9d7a';else if(m[3]){if(KW.has(s))col='#ff7ab2';else if(/^[A-Z]/.test(s))col='#6fdcff';else if(prev==='.')col='#9fe0b4';}else if(m[4])col='#c5cad3';
        c.fillStyle=col;c.fillText(s,x,y);x+=c.measureText(s).width;if(!m[5])prev=s.slice(-1);}
      y+=15;});},
  doc(c,w){c.fillStyle='#16181c';c.font='600 18px '+SANS;c.fillText('需求记录 · 10月8日',w.x+28,w.y+64);c.font='13.5px '+SANS;c.fillStyle='#4a4f57';
    c.fillText('· 截图后自动移进 ~/Screenshots，桌面保持干净',w.x+28,w.y+92);c.fillText('· 顶部只放最近 8 张，拖出去就是拷贝',w.x+28,w.y+113);

/* ───────── items ───────── */

function grid(it){

cap.addEventListener('pointerdown',e=>{const p=loc(e);
  if(mode==='region'){dragStart=p;try{cap.setPointerCapture(e.pointerId);}catch(_){}setMarq({x:p.x,y:p.y,w:0,h:0});}
  else if(mode==='window'){const w=winAt(p);if(w){exitCapture();capture({x:w.x,y:w.y,w:w.w,h:w.h});}}});
cap.addEventListener('pointerup',e=>{if(mode==='region'&&dragStart){const r=norm(dragStart,loc(e));exitCapture();if(r.w>8&&r.h>8)capture(r);}});
function capture(r){
  r={x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.w),h:Math.round(r.h)};const it=makeItem(r);
  const f=el('div','flash');Object.assign(f.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'});stage.append(f);
  f.animate([{opacity:0},{opacity:.9,offset:.22},{opacity:0}],{duration:D(340),easing:'ease-out'}).onfinish=()=>f.remove();sfx.shutter();
  queue(async()=>{busy=true;clearHide();try{await C_().land(it,r);}finally{busy=false;}paintSel();setCount();scheduleHide(4600);});
}

/* demo capture: draws a marquee by itself */
const demos=[{x:752,y:276,w:340,h:258},{x:96,y:330,w:452,h:150},{x:904,y:628,w:432,h:226},{x:1036,y:276,w:228,h:136},{x:70,y:200,w:600,h:420}];
let di=0,demoTok=0;
async function demo(){const tok=++demoTok;const r=demos[di++%demos.length];if(mode)return;cap.className='on region demo';setCross(r.x,r.y);await wait(D(260));
  if(tok!==demoTok)return;await tween(D(720),p=>{if(tok!==demoTok)return;const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;setCross(r.x+r.w*e,r.y+r.h*e);setMarq({x:r.x,y:r.y,w:r.w*e,h:r.h*e});});
  if(tok!==demoTok)return;await wait(D(160));if(tok!==demoTok)return;exitCapture();capture(r);}
function cancelDemo(){demoTok++;if(cap.classList.contains('demo'))exitCapture();}

/* ───────── selection, drag, quick look ───────── */
const sel=new Set();let dragIds=null,dragFrom=null,hoverId=null,qlId=null;
const ghost=$('#ghost'),dropHint=$('#dropHint'),ql=$('#ql'),toastEl=$('#toast');
Object.assign(dropHint.style,{left:docWin.x+'px',top:docWin.y+'px',width:docWin.w+'px',height:docWin.h+'px'});
function paintSel(){stage.querySelectorAll('.shot').forEach(s=>s.classList.toggle('is-sel',!!s.dataset.id&&sel.has(+s.dataset.id)));}
let toastT=0;function toast(t){toastEl.textContent=t;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),2400);}
const inDoc=p=>p.x>=docWin.x&&p.x<=docWin.x+docWin.w&&p.y>=docWin.y&&p.y<=docWin.y+docWin.h;

stage.addEventListener('pointerdown',e=>{
  if(mode)return;
  if(e.target.closest('.folder-chip')){toast(`打开 ~/Screenshots · ${shownTotal} 张截图平铺在同一个文件夹里`);return;}
  const s=e.target.closest('.shot[data-id]');
  if(!s){if(qlId==null&&sel.size){sel.clear();paintSel();}return;}
  e.preventDefault();const id=+s.dataset.id,p0=loc(e);let dragging=false;
  const mv=ev=>{const p=loc(ev);if(!dragging&&Math.hypot(p.x-p0.x,p.y-p0.y)>5){dragging=true;startDrag(id,s,p);}if(dragging)moveDrag(p);};
  const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);if(dragging)endDrag(loc(ev));else clickShot(id,ev);};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);
});
stage.addEventListener('dblclick',e=>{const s=e.target.closest('.shot[data-id]');if(s)openQL(+s.dataset.id);});
stage.addEventListener('pointerover',e=>{if(!mounted)return;const s=e.target.closest('.shot[data-id]');const id=s?+s.dataset.id:null;if(id!==hoverId){hoverId=id;C_().hover?.(id);}});
function clickShot(id,e){if(e.shiftKey||e.metaKey||e.ctrlKey){sel.has(id)?sel.delete(id):sel.add(id);}else{sel.clear();sel.add(id);}paintSel();}
function startDrag(id,s,p){
  if(!sel.has(id)){sel.clear();sel.add(id);paintSel();}
  dragIds=[...sel].filter(byId);dragFrom=sRect(s);ghost.innerHTML='';
  const list=dragIds.map(byId).slice(0,3);
  list.forEach((it,k)=>{const f=fitBox(it.r.w,it.r.h,170,110);const c=el('div','g-card');c.style.cssText=`width:${f.w}px;height:${f.h}px;margin:${-f.h/2}px 0 0 ${-f.w/2}px;transform:rotate(${(k-(list.length-1)/2)*5}deg) translate(${k*5}px,${k*5}px);z-index:${10-k}`;c.innerHTML=`<img src="${it.url}" alt="">`;ghost.append(c);
    if(k===0&&dragIds.length>1){const b=el('div','g-count',String(dragIds.length));b.style.left=(f.w/2-12)+'px';b.style.top=(-f.h/2-10)+'px';ghost.append(b);}});
  ghost.append(el('div','g-plus','+'));ghost.hidden=false;
  stage.querySelectorAll('.shot[data-id]').forEach(n=>{if(dragIds.includes(+n.dataset.id))n.classList.add('dragging');});s.classList.add('grab');
  moveDrag(p);
}
function moveDrag(p){ghost.style.transform=`translate(${p.x}px,${p.y}px)`;const over=inDoc(p);dropHint.classList.toggle('on',over);ghost.classList.toggle('copy',over);}
async function endDrag(p){
  const its=dragIds.map(byId).filter(Boolean),over=inDoc(p);
  stage.querySelectorAll('.dragging,.grab').forEach(n=>n.classList.remove('dragging','grab'));dropHint.classList.remove('on');
  if(over){await ghost.animate([{transform:`translate(${p.x}px,${p.y}px) scale(1)`,opacity:1},{transform:`translate(${docWin.x+docWin.w/2}px,${docWin.y+docWin.h-70}px) scale(.35)`,opacity:0}],{duration:260,easing:'cubic-bezier(.4,0,.2,1)'}).finished;
    docWin.drops.push(...its.slice().reverse().map(t=>t.src));drawDesk();sfx.drop();toast(`已拷贝 ${its.length} 张截图到「未命名文稿」`);}
  else await ghost.animate([{transform:`translate(${p.x}px,${p.y}px) scale(1)`,opacity:1},{transform:`translate(${dragFrom.x+dragFrom.w/2}px,${dragFrom.y+dragFrom.h/2}px) scale(.6)`,opacity:0}],{duration:300,easing:'cubic-bezier(.3,0,.2,1)'}).finished;
  ghost.hidden=true;ghost.innerHTML='';ghost.classList.remove('copy');dragIds=null;scheduleHide(2200);
}
function openQL(id){const it=byId(id);if(!it)return;qlId=id;const f=fitBox(it.r.w,it.r.h,1040,640);
  ql.innerHTML=`<figure style="width:${f.w+20}px"><img src="${it.url}" style="width:${f.w}px;height:${f.h}px" alt="${fname(it.t)}"><figcaption><b>${fname(it.t)}</b><span>${it.pw} × ${it.ph} · ~/Screenshots</span></figcaption></figure>`;
  ql.hidden=false;ql.animate([{opacity:0},{opacity:1}],{duration:180});ql.firstChild.animate([{transform:'scale(.92)'},{transform:'scale(1)'}],{duration:260,easing:'cubic-bezier(.3,1.3,.5,1)'});}
function closeQL(){if(qlId==null)return;qlId=null;ql.hidden=true;ql.innerHTML='';}
ql.addEventListener('pointerdown',e=>{e.stopPropagation();closeQL();});
function removeSel(){const ids=[...sel].filter(byId);if(!ids.length)return;
  queue(async()=>{ids.forEach(id=>{const i=items.findIndex(t=>t.id===id);if(i>=0)items.splice(i,1);});sel.clear();await C_().remove(ids);paintSel();setCount();});
  toast(`已从托盘移出 ${ids.length} 张，文件仍在 ~/Screenshots`);}

/* ───────── stage pointer / hot zone ───────── */
stage.addEventListener('pointermove',e=>{const p=loc(e);lastP=p;if(mode||!mounted)return;C_().pointer?.(p);
  if(p.y<40)setShown(true);
  if(shown&&p.y<C_().bottom)clearHide();else if(shown&&!hideT)scheduleHide(1800);});
stage.addEventListener('pointerleave',()=>{lastP=null;if(!mounted)return;C_().pointer?.({x:-50,y:9999});scheduleHide(1800);});

/* ───────── header, keys, spec ───────── */
const SPEC={
  A:{name:'标尺',en:'Ruler & Guides',sw:'sw-A',
    lede:'把晾衣绳换成设计软件里的像素标尺，把衣夹换成参考线。截图被一根参考线从原位钓回屏幕顶部，吸附在标尺下面。',
    why:'标尺刻度、青色参考线、W×H 尺寸标注，都是你框选截图那一刻眼睛正在看的东西。每张缩略图下面标着真实的像素尺寸；鼠标悬停时，标尺会量出它占的那一段。',
    steps:['快门白闪，选区原地停住','标尺从刘海向左右两侧展开','一根参考线从标尺垂直落下，落到截图所在的高度','截图缩小，横移对准参考线','参考线收回，把截图拉到顶部，带一点吸附回弹，尺寸数字从 0 跑到实际值'],
    full:'超过 8 张时，最右边最旧的那张沿标尺滑进 ~/Screenshots。'},
  B:{name:'帧缓冲',en:'Ring Buffer',sw:'sw-B',
    lede:'刘海是数据端口，托盘是一块 8 格的环形缓冲区。截图先被扫描、拆成像素块，流进刘海，再在槽位里逐行写回成图像。',
    why:'顶部只留最近几张、其余落到磁盘，这本来就是缓冲区和磁盘的关系。槽位地址 0x00 到 0x07、闪烁的写指针、RGB 三色写入头，都直接借用显示硬件的概念。',
    steps:['RGB 扫描线从上到下读一遍选区，读过的地方变成马赛克','刘海展开成 8 个槽位','马赛克拆成像素块，沿弧线飞进对应的槽位','像素块在槽位里重新拼成一张缩小的马赛克','写入头逐行扫过，图像变清晰'],
    full:'写指针循环前进。写到已占用的槽位时，旧图碎成像素冲向 ~/Screenshots。代价是槽位按地址排列，不按时间重排。'},
  C:{name:'图层',en:'Layers',sw:'sw-C',
    lede:'截图就是从屏幕上揭下一层像素。揭走的地方先露出透明棋盘格，再从上往下愈合；揭下来的图层飞到顶部，叠成一摞侧向分解的图层。',
    why:'透明棋盘格、蚂蚁线选区、图层叠放来自图像软件；侧向分解的 3D 视图来自界面调试工具。每一样都是天天在屏幕上处理像素的人认得的东西。',
    steps:['快门白闪，选区边缘留着蚂蚁线','图层像贴纸一样翘起，原位露出棋盘格','图层飞向顶部，途中旋转成侧向的平面','插到最前面，后面的图层依次后退','原位的棋盘格从上往下愈合'],
    full:'鼠标移进托盘，图层摊开并显示名字；悬停的那层转正、浮起。抓起时从 3D 拍平成 2D，拖到别处就是粘贴。超过 8 层时，最后一层缩进 ~/Screenshots。'}
};
function renderSpec(){const s=SPEC[cur.k],idx='ABC'.indexOf(cur.k)+1;
  $('#spec').innerHTML=`<div><div class="eyebrow"><span class="sw ${s.sw}"></span>方向 ${cur.k} · ${idx} / 3</div><h2>${s.name}</h2><div class="en">${s.en}</div><p class="lede">${s.lede}</p><h3>为什么属于电脑</h3><p>${s.why}</p></div>
  <div><h3>截图落下的过程</h3><ol>${s.steps.map(t=>`<li>${t}</li>`).join('')}</ol><h3>托盘满了以后</h3><p>${s.full}</p></div>
  <div><h3>三个方向共用的交互</h3><dl class="keys">
    <dt>截图</dt><dd><kbd>4</kbd>框选，<kbd>W</kbd>选窗口，<kbd>3</kbd>全屏。真机上对应 ⌘⇧4、⌘⇧4 加空格、⌘⇧3</dd>
    <dt>唤出</dt><dd>鼠标移到屏幕顶部。截图时自动出现，几秒后收起</dd>
    <dt>选中</dt><dd>单击，按住 ⇧ 多选</dd>
    <dt>拷贝</dt><dd>把缩略图拖进「未命名文稿」窗口</dd>
    <dt>预览</dt><dd><kbd>空格</kbd>或双击</dd>
    <dt>移出</dt><dd><kbd>⌫</kbd> 只移出托盘，文件还在</dd>
    <dt>切换</dt><dd><kbd>A</kbd><kbd>B</kbd><kbd>C</kbd></dd></dl>
    <h3>文件去向</h3><p>截图一出现就被移进 <code>~/Screenshots</code>，所有图片平铺在这一个文件夹里，不建子文件夹。按天分组、往回翻交给访达。顶部托盘只显示最近 ${N} 张。</p></div>`;}
function updateTabs(){document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===cur.k));}
function switchTo(k){if(k===cur.k)return;cur.k=k;updateTabs();renderSpec();queue(async()=>{cancelDemo();exitCapture();closeQL();mounted.unmount();shown=true;mounted=concepts[k];mounted.mount();paintSel();await wait(450);demo();});}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>switchTo(b.dataset.k)));
$('#b-region').onclick=()=>enterCapture('region');$('#b-window').onclick=()=>enterCapture('window');$('#b-full').onclick=()=>enterCapture('full');
$('#b-hide').onclick=e=>{autoHide=!autoHide;e.currentTarget.setAttribute('aria-pressed',autoHide);if(!autoHide){clearHide();setShown(true);}else scheduleHide(2000);};
$('#b-sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.setAttribute('aria-pressed',soundOn);};
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toLowerCase();
  if(k==='escape'){if(qlId!=null)closeQL();else if(mode)exitCapture();else{sel.clear();paintSel();}}
  else if(k===' '){if(e.target.closest('button'))return;e.preventDefault();if(qlId!=null)closeQL();else{const id=[...sel][0]??hoverId;if(id!=null)openQL(id);}}
  else if(k==='4')enterCapture('region');else if(k==='w'||k==='5')enterCapture('window');else if(k==='3')enterCapture('full');
  else if(k==='a'||k==='b'||k==='c')switchTo(k.toUpperCase());
  else if(k==='backspace'||k==='delete'){e.preventDefault();removeSel();}});

/* ───────── boot ───────── */
async function boot(){
  drawDesk();
  try{await Promise.race([Promise.all(['500 12px "Geist Mono"','600 13px "Geist"','400 13px "Geist"'].map(f=>document.fonts.load(f))),wait(1500)]);}catch(_){}
  drawDesk();
  const now=Date.now();
  [{x:0,y:0,w:W,h:H,ago:46},{x:70,y:200,w:600,h:420,ago:31},{x:740,y:268,w:520,h:270,ago:18},{x:880,y:582,w:470,h:290,ago:7}]
    .forEach(p=>items.unshift(makeItem(p,new Date(now-p.ago*60000-Math.random()*50000))));
  shownTotal=total;updateTabs();renderSpec();mounted=A;A.mount();setCount();
  setTimeout(demo,900);setInterval(drawDesk,30000);
}
boot();
})();
</script>
